<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nos espera Raúl</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧉</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="bg-stripes"></div>
  <div class="bg-leaves" id="bg-leaves" aria-hidden="true"></div>
  <div class="bg-brands" id="bg-brands" aria-hidden="true"></div>

  <canvas id="confetti-canvas" aria-hidden="true"></canvas>

  <main>
    <div class="sun" aria-hidden="true">☀</div>

    <h1 class="title">Nos espera <span class="raul">Raúl</span></h1>
    <p class="subtitle">La banda está lista. Argentina también.</p>

    <div class="stage">
      <section class="timer-card" id="timer-card">
        <div class="timer" id="timer" role="timer" aria-live="polite">
          <div class="unit">
            <span class="num" id="hours">00</span>
            <span class="label">HS</span>
          </div>
          <span class="colon">:</span>
          <div class="unit">
            <span class="num" id="minutes">00</span>
            <span class="label">MIN</span>
          </div>
          <span class="colon">:</span>
          <div class="unit">
            <span class="num" id="seconds">00</span>
            <span class="label">SEG</span>
          </div>
        </div>
        <p class="target-label">hasta las 17:30 de hoy</p>
        <p class="done-message" id="done-message" hidden>¡Llegó Raúl! 🎉🧉</p>
      </section>

      <div class="mate-wrap" aria-hidden="true">
        <svg class="mate" viewBox="0 0 220 260" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="110" cy="245" rx="46" ry="9" fill="#000" opacity="0.12"/>
          <path d="M55 150 Q50 230 110 235 Q170 230 165 150 Q168 100 110 95 Q52 100 55 150Z" fill="#8a5a2b"/>
          <path d="M55 150 Q50 230 110 235 Q170 230 165 150 Q168 100 110 95 Q52 100 55 150Z" fill="none" stroke="#5c3a19" stroke-width="3"/>
          <path d="M60 130 Q110 145 160 130" fill="none" stroke="#5c3a19" stroke-width="2" opacity="0.5"/>
          <path d="M58 165 Q110 182 162 165" fill="none" stroke="#5c3a19" stroke-width="2" opacity="0.4"/>
          <ellipse cx="110" cy="92" rx="34" ry="10" fill="#6b4423"/>
          <ellipse cx="110" cy="90" rx="30" ry="8" fill="#3e2a17"/>
          <path d="M118 88 Q170 65 205 20" fill="none" stroke="#c9c9c9" stroke-width="9" stroke-linecap="round"/>
          <path d="M118 88 Q170 65 205 20" fill="none" stroke="#e8e8e8" stroke-width="4" stroke-linecap="round"/>
          <ellipse cx="207" cy="17" rx="9" ry="6" fill="#b9b9b9" transform="rotate(-35 207 17)"/>
          <g opacity="0.9">
            <path d="M85 95 q3 -14 -3 -22" stroke="#3c7a3c" stroke-width="4" fill="none" stroke-linecap="round"/>
            <path d="M97 90 q1 -16 -6 -24" stroke="#4c8f4c" stroke-width="4" fill="none" stroke-linecap="round"/>
            <path d="M109 88 q0 -17 0 -25" stroke="#3c7a3c" stroke-width="4" fill="none" stroke-linecap="round"/>
            <path d="M121 90 q-1 -16 6 -23" stroke="#4c8f4c" stroke-width="4" fill="none" stroke-linecap="round"/>
          </g>
        </svg>
      </div>
    </div>

    <div class="ribbon" aria-hidden="true">
      <span class="stripe blue"></span>
      <span class="stripe white"></span>
      <span class="stripe blue"></span>
    </div>

    <p class="footer-note">🧉&nbsp;&nbsp;🇦🇷&nbsp;&nbsp;⚽&nbsp;&nbsp;vamos que se puede</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
