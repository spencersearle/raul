<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nos espera Raúl</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧉</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="bg-stripes" aria-hidden="true"></div>

  <canvas id="confetti-canvas" aria-hidden="true"></canvas>

  <div class="water" id="water" aria-hidden="true">
    <svg class="wave wave--back" viewBox="0 0 1440 80" preserveAspectRatio="none">
      <path d="M0 40 C120 10 240 10 360 40 S600 70 720 40 S960 10 1080 40 S1320 70 1440 40 L1440 80 L0 80 Z"/>
    </svg>
    <svg class="wave wave--front" viewBox="0 0 1440 80" preserveAspectRatio="none">
      <path class="wave__fill" d="M0 40 C120 10 240 10 360 40 S600 70 720 40 S960 10 1080 40 S1320 70 1440 40 L1440 80 L0 80 Z"/>
      <path class="wave__crest" d="M0 40 C120 10 240 10 360 40 S600 70 720 40 S960 10 1080 40 S1320 70 1440 40"/>
    </svg>
    <div class="water-body"></div>
  </div>

  <div class="toast" id="water-error" role="status" aria-live="assertive">Raúl ya está lleno!</div>

  <button type="button" class="water-btn" id="water-btn">
    <span class="water-btn__drop" aria-hidden="true">💧</span>
    Presiona para agregar agua
  </button>

  <div class="water-counter" id="water-counter" aria-live="off">
    <span class="water-counter__num" id="water-amount">0.0</span>
    <span class="water-counter__unit">/ 2.7 L</span>
  </div>

  <main>
    <header class="masthead">
      <div class="sol" aria-hidden="true"></div>
      <h1 class="title">Nos espera <span class="raul">Raúl</span></h1>
      <p class="subtitle">La banda está lista. Argentina también.</p>
    </header>

    <div class="stage">
      <section class="timer-card" id="timer-card">
        <div class="timer" id="timer" role="timer" aria-live="polite">
          <div class="unit">
            <span class="num" id="hours">00</span>
            <span class="label">horas</span>
          </div>
          <span class="colon">:</span>
          <div class="unit">
            <span class="num" id="minutes">00</span>
            <span class="label">minutos</span>
          </div>
          <span class="colon">:</span>
          <div class="unit">
            <span class="num" id="seconds">00</span>
            <span class="label">segundos</span>
          </div>
        </div>
        <p class="target-label">hasta las 17:30 de hoy</p>
        <p class="done-message" id="done-message" hidden>¡Llegó Raúl! 🎉🧉</p>
      </section>

      <div class="mate-wrap" aria-hidden="true">
        <svg class="mate" viewBox="38 2 188 246" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="gourdFill" x1="0" y1="0" x2="1" y2="0.4">
              <stop offset="0%" stop-color="#c8834a"/>
              <stop offset="55%" stop-color="#ad6835"/>
              <stop offset="100%" stop-color="#8f5126"/>
            </linearGradient>
            <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#f4f6f8"/>
              <stop offset="55%" stop-color="#c6ccd2"/>
              <stop offset="100%" stop-color="#9aa2aa"/>
            </linearGradient>
          </defs>

          <g stroke="#1a1a1a" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
            <!-- gourd -->
            <path d="M58 112 C55 130, 49 141, 47 160 C43 184, 47 210, 60 224
                     C68 233, 74 238, 84 239 L116 239 C126 238, 132 233, 140 224
                     C153 210, 157 184, 153 160 C151 141, 145 130, 142 112 Z"
                  fill="url(#gourdFill)"/>

            <!-- rim band around the mouth -->
            <path d="M58 112 v10 a42 12 0 0 0 84 0 v-10 z" fill="#aeb5bc" stroke-width="5"/>
            <ellipse cx="100" cy="112" rx="42" ry="12" fill="#e2e6ea" stroke-width="5"/>
          </g>

          <!-- yerba inside the mouth -->
          <ellipse cx="100" cy="112" rx="33" ry="8.5" fill="#15280f"/>
          <path d="M70 112 Q100 103 130 112 Q100 120 70 112 Z" fill="#2f7d3a"/>

          <!-- highlight streak -->
          <g stroke="#ffffff" stroke-linecap="round" fill="none" opacity="0.85">
            <path d="M74 178 C69 194, 70 208, 77 218" stroke-width="7"/>
          </g>
          <circle cx="83" cy="228" r="4" fill="#ffffff" opacity="0.85"/>

          <!-- bombilla -->
          <path d="M114 116 L170 50 L214 21" fill="none" stroke="#1a1a1a"
                stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M114 116 L170 50 L214 21" fill="none" stroke="url(#steel)"
                stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
          <g transform="rotate(41 170 50)">
            <rect x="160" y="45" width="20" height="10" rx="2.5"
                  fill="#9aa2aa" stroke="#1a1a1a" stroke-width="4"/>
          </g>
        </svg>
      </div>
    </div>

    <footer class="outro">
      <svg class="jersey" viewBox="0 0 100 96" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Camiseta argentina número 10">
        <defs>
          <clipPath id="shirtClip">
            <path d="M24 13 L40 6 C44 13, 56 13, 60 6 L76 13 L86 31 L72 38 L72 84 C60 89, 40 89, 28 84 L28 38 L14 31 Z"/>
          </clipPath>
        </defs>
        <g clip-path="url(#shirtClip)">
          <rect x="0" y="0" width="100" height="96" fill="#ffffff"/>
          <g fill="#74acdf">
            <rect x="14" y="0" width="11" height="96"/>
            <rect x="36" y="0" width="11" height="96"/>
            <rect x="58" y="0" width="11" height="96"/>
            <rect x="80" y="0" width="11" height="96"/>
          </g>
        </g>
        <path d="M24 13 L40 6 C44 13, 56 13, 60 6 L76 13 L86 31 L72 38 L72 84 C60 89, 40 89, 28 84 L28 38 L14 31 Z"
              fill="none" stroke="#12324a" stroke-width="3.5" stroke-linejoin="round"/>
        <text x="50" y="70" text-anchor="middle" font-family="'Baloo 2', sans-serif" font-weight="800"
              font-size="36" fill="#12324a">10</text>
      </svg>
      <p class="footer-note">vamos que se puede</p>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
